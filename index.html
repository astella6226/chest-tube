<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胸管護理實戰測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0fdf4; }
        .quiz-card { display: none; }
        .quiz-card.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-green-100">
        <div class="bg-green-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold"><i class="fas fa-stethoscope mr-2"></i>胸管植入術護理 - 實戰測驗</h1>
            <p class="mt-2 opacity-90">依據 SOP-1N00-NTC18 規範設計</p>
        </div>

        <div id="quiz-container" class="p-6 md:p-8">
            <!-- Question 1 -->
            <div class="quiz-card active" data-step="1">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Q1. 協助醫師插管前消毒時，使用 Chlorhexidine 2% in Alcohol 70% 消毒後，最重要的步驟是？</h2>
                <div class="space-y-3">
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(1, 'A')">A. 立即鋪上無菌洞巾以節省時間</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(1, 'B')">B. 必須等待自然乾燥 (約兩分鐘) 才有殺菌效果</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(1, 'C')">C. 使用無菌紗布將多餘的消毒液擦乾</button>
                </div>
            </div>

            <!-- Question 2 -->
            <div class="quiz-card" data-step="2">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Q2. 關於胸管傷口的固定，下列順序何者正確？</h2>
                <div class="space-y-3">
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(2, 'A')">A. 紗布覆蓋 → Y紗 → 布膠架橋式 → 紙膠平貼</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(2, 'B')">B. 置入Y紗 → 紗布覆蓋 → 紙膠(或Mefix)平貼 → 布膠「架橋式(Ω)」黏貼皮膚</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(2, 'C')">C. 置入Y紗 → 紙膠平貼 → 布膠十字固定 → 紗布覆蓋</button>
                </div>
            </div>

            <!-- Question 3 -->
            <div class="quiz-card" data-step="3">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Q3. 胸管與「外科連接管」的接合處，應採何種方式固定？</h2>
                <div class="space-y-3">
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(3, 'A')">A. 以布膠採「十字」固定</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(3, 'B')">B. 不需固定，維持管路彈性</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(3, 'C')">C. 以布膠採「跨橋式」固定</button>
                </div>
            </div>

            <!-- Question 4 -->
            <div class="quiz-card" data-step="4">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Q4. 當病患有多重引流管 (2條以上) 時，為防止錯接，應如何標示？</h2>
                <div class="space-y-3">
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(4, 'A')">A. 僅需在靠近「引流瓶端」清楚標示部位</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(4, 'B')">B. 需在靠近「病人端」與「引流瓶端」的管路皆清楚標示引流部位及編號</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(4, 'C')">C. 統一在護理紀錄中註記即可，管路上不需黏貼標籤</button>
                </div>
            </div>

            <!-- Question 5 -->
            <div class="quiz-card" data-step="5">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Q5. 若胸腔引流瓶有接 Vaccum，病患進行轉送前 (如去照X光)，最重要的處置是？</h2>
                <div class="space-y-3">
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(5, 'A')">A. 轉送時將 Vaccum 端之外科接管先移除，讓引流瓶通大氣</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(5, 'B')">B. 直接帶著接上 Vaccum 的管路轉送到其他單位</button>
                    <button class="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-green-500 hover:bg-green-50 transition" onclick="selectAnswer(5, 'C')">C. 使用兩支 Kelly 夾住胸管後再轉送</button>
                </div>
            </div>

            <!-- Results -->
            <div id="result-section" class="hidden text-center">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-4">
                    <i class="fas fa-check-circle text-4xl text-green-500"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">測驗完成！</h2>
                <p id="score-display" class="text-3xl font-bold text-green-600 mb-6">總分: 0 / 100</p>
                
                <div class="bg-gray-50 rounded-lg p-6 text-left mb-6">
                    <h3 class="font-bold text-gray-700 mb-4"><i class="fas fa-clipboard-list mr-2"></i>回顧與解析</h3>
                    <ul id="review-list" class="space-y-4 text-sm text-gray-600">
                        <!-- 解析內容由 JS 動態生成 -->
                    </ul>
                </div>

                <!-- 單位與代號輸入 -->
                <div class="mb-6 text-left space-y-4 max-w-sm mx-auto">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">單位</label>
                        <input type="text" id="unitInput" class="w-full p-3 border rounded-lg" placeholder="例如：5A">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">員工代號</label>
                        <input type="text" id="idInput" class="w-full p-3 border rounded-lg" placeholder="例如：N12345">
                    </div>
                    <button onclick="submitTest()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg">
                        送出成績至後台
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const correctAnswers = { 1: 'B', 2: 'B', 3: 'C', 4: 'B', 5: 'A' };
        const explanations = {
            1: '插管前使用 Chlorhexidine 消毒後，必須等待自然乾燥(約2分鐘)才有殺菌效果。',
            2: '正確順序為：置入Y紗 → 紗布覆蓋 → 紙膠(或Mefix)平貼 → 布膠「架橋式(Ω)」黏貼。',
            3: '胸管與外科連接管的接合處，應以布膠採「跨橋式」固定；外科接管與引流瓶接合處則採「十字」固定。',
            4: '多重引流管為2條以上時，需在靠近「病人端」及「引流瓶端」的管路都清楚標示部位與編號。',
            5: '轉送時必須將 Vaccum 端之外科接管移除，讓引流瓶通大氣，嚴禁帶著接上 Vaccum 的管路轉送。'
        };
        let userAnswers = {};
        
        function selectAnswer(questionNum, answer) {
            userAnswers[questionNum] = answer;
            
            // 隱藏當前題目，顯示下一題或結果
            document.querySelector(`.quiz-card[data-step="${questionNum}"]`).classList.remove('active');
            
            if (questionNum < 5) {
                document.querySelector(`.quiz-card[data-step="${questionNum + 1}"]`).classList.add('active');
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('result-section').classList.remove('hidden');
            let score = 0;
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const isCorrect = userAnswers[i] === correctAnswers[i];
                if (isCorrect) score += 20;

                const li = document.createElement('li');
                li.className = "pb-4 border-b border-gray-200 last:border-0";
                li.innerHTML = `
                    <p class="font-bold text-gray-800">Q${i}. ${isCorrect ? '<span class="text-green-500">✔ 答對</span>' : '<span class="text-red-500">✘ 答錯</span>'}</p>
                    <p class="mt-1 text-gray-600">正確解答：${correctAnswers[i]}</p>
                    <p class="mt-1 text-gray-500 text-xs bg-gray-100 p-2 rounded">💡 解析：${explanations[i]}</p>
                `;
                reviewList.appendChild(li);
            }
            
            window.finalScore = score;
            document.getElementById('score-display').innerText = `總分: ${score} / 100`;
        }

        function submitTest() {
            const unit = document.getElementById('unitInput').value;
            const id = document.getElementById('idInput').value;
            
            if (!unit || !id) {
                alert("請填寫單位與員工代號！");
                return;
            }

            // 請將此處替換為您的 Google Apps Script 網址
const scriptUrl = '[https://script.google.com/macros/s/AKfycbzmjwsx8IVl97f1eMyZpKpxwenHvIoB4HeNFFC8-iJA6sdDwnGd60SfPwox3P0gKvQDQ/exec](https://script.google.com/macros/s/AKfycbzmjwsx8IVl97f1eMyZpKpxwenHvIoB4HeNFFC8-iJA6sdDwnGd60SfPwox3P0gKvQDQ/exec)';            
            if(scriptUrl === '請替換為您的 Apps Script 網址') {
                alert("成績結算成功！\n(備註：請記得在原始碼中貼上 Apps Script 網址才能將資料送到試算表)");
                return;
            }

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    unit: unit,
                    id: id,
                    score: window.finalScore
                })
            }).then(() => {
                alert("成績已成功送出！指導老師已經收到囉！");
            }).catch(err => {
                console.error(err);
                alert("送出發生錯誤，請稍後再試。");
            });
        }
    </script>
</body>
</html>
